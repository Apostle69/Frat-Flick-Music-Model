<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FratFlick Pose Model</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #172033; }
        main { width: min(100%, 620px); padding: clamp(20px, 5vw, 40px); text-align: center; background: #fff; border-radius: 18px; box-shadow: 0 12px 35px #1720331c; }
        h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); }
        .hint { margin: 0 0 24px; color: #64748b; }
        button { border: 0; border-radius: 999px; padding: 12px 28px; background: #2563eb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .preview { width: min(100%, 480px); aspect-ratio: 1; margin: 24px auto; overflow: hidden; border: 4px solid #dbeafe; border-radius: 14px; background: #0f172a; }
        canvas { display: block; width: 100%; height: 100%; }
        #label-container { display: grid; gap: 8px; text-align: left; }
        #label-container div { padding: 10px 14px; border-radius: 8px; background: #eff6ff; color: #1e3a8a; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <h1>FratFlick Pose Model</h1>
    <label for="file-upload">Upload music to flick to:</label>
    <input id="file-upload" type="file" accept="audio/*can I">
    <p class="hint">Start the camera to see live pose predictions.</p>
    <button type="button" onclick="init()">Start camera</button>
    <button type="button" onclick="webcam.stop()">Stop camera</button>
    <div class="preview"><canvas id="canvas" width="400" height="400"></canvas></div>
    <div id="label-container" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script type="text/javascript">
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/pose

    // the link to your model provided by Teachable Machine export panel
    const URL = "./Model/";
    const flickAud = new Audio('SoftlyMannequinPussy.mp3'); //ADD FUNCTIONALITY TO ALLOW USER TO SELECT AUDIO FILE TO FLICK TO BASED ON THEIR UPLOADED FILES
    // keys for checking the predictions 
    const fratKey = "Frat Flicking"
    const flickThreshold = 0.7;
    let model, webcam, ctx, labelContainer, maxPredictions, flickScore = 0;

    //test audio
    function isAudioPlaying(audio) {
        return !audio.paused && !audio.ended && audio.currentTime > 0;
    }

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // Note: the pose library adds a tmPose object to your window (window.tmPose)
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const size = 400;
        const flip = true; // whether to flip the webcam
        webcam = new tmPose.Webcam(size, size, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append/get elements to the DOM
        const canvas = document.getElementById("canvas");
        canvas.width = size; canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) { // and class labels
            labelContainer.appendChild(document.createElement("div"));
        }
    }

    async function loop(timestamp) {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        // Prediction #1: run input through posenet
        // estimatePose can take in an image, video or canvas html element
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        // Prediction 2: run input through teachable machine classification model
        const prediction = await model.predict(posenetOutput);

        for (let i = 0; i < maxPredictions; i++) {
            flickScore = prediction[i].className === fratKey ? prediction[i].probability.toFixed(2) : flickScore;            
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }

        const track = new Audio('audio-file.mp3');
        //finsih adding the event listeners for the music and frat flicking
        if(!sAudioPlaying(flickAud) && flickScore > flickThreshold ){
            flickAud.play();

        } else if (flickScore < flickThreshold) {
            flickAud.pause();
        }

        // finally draw the poses
        drawPose(pose);
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            // draw the keypoints and skeleton
            if (pose) {
                const minPartConfidence = 0.5;
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }
</script>
</body>
</html>
